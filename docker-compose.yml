services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: oltp_sources
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - ./backups:/var/opt/mssql/backup
      - sql_data:/var/opt/mssql/data

volumes:
  sql_data:

